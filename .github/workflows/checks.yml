name: Checks
on:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  checks:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:setup
      - run: npm run check
      - uses: actions/upload-artifact@v4
        with:
          name: foundry-package
          path: dist/
          if-no-files-found: error
